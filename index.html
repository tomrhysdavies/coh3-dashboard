<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoH Strategic Command</title>
    <style>
        :root {
            --accent: #d4af37;
            --bg: #0f1112;
            --card-bg: #1a1d1f;
            --text-main: #e0e0e0;
            --text-dim: #8a8d90;
            --border: #2d3135;
            --color-unit: #2e5a88;
            --color-build: #882e2e;
            --color-tech: #887a2e;
            --danger: #b71c1c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
        }

        nav {
            width: 80px;
            background: #08090a;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 15px;
        }

        .faction-icon {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #141617;
            color: var(--text-dim);
            font-size: 0.7rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .faction-icon.active { background: var(--accent); color: #000; }

        main { flex: 1; padding: 30px; overflow-y: auto; }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 30px;
        }

        .sub-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .strat-pill {
            padding: 6px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .strat-pill.active { border-color: var(--accent); color: var(--accent); }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .phase-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .phase-title {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: block;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
            position: relative;
        }

        .item.completed { opacity: 0.2; filter: grayscale(1); }

        .tag {
            width: 4px;
            height: 20px;
            margin-right: 10px;
            border-radius: 2px;
        }

        .tag-unit { background: var(--color-unit); }
        .tag-build { background: var(--color-build); }
        .tag-tech { background: var(--color-tech); }

        .delete-btn {
            color: var(--danger);
            font-weight: bold;
            margin-left: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
        }

        .add-btn {
            width: 100%;
            background: none;
            border: 1px dashed var(--border);
            color: var(--text-dim);
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 10px;
        }

        .add-btn:hover { border-color: var(--accent); color: var(--accent); }

        [contenteditable="true"] {
            border-bottom: 1px dashed var(--accent);
            outline: none;
            min-width: 20px;
            display: inline-block;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-save { background: #2e7d32; color: white; }
        .btn-edit { background: var(--accent); color: #000; }
        .btn-add-strat { background: #444; color: white; }
    </style>
</head>
<body>

<nav id="factionNav"></nav>

<main>
    <div class="header-controls">
        <h2 id="currentFactionLabel" style="font-weight: 300; margin: 0;">UNITED STATES FORCES</h2>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-edit" id="editToggle" onclick="toggleEdit()">EDIT BUILDS</button>
            <button class="btn btn-save" onclick="saveData()">SAVE STATE</button>
            <button class="btn" style="background:#444; color:white;" onclick="resetProgress()">RESET RUN</button>
        </div>
    </div>

    <div class="sub-nav" id="stratNav"></div>

    <div class="grid" id="buildGrid">
        <div class="phase-card" id="early">
            <span class="phase-title">Early Game</span>
            <div class="items-container"></div>
        </div>
        <div class="phase-card" id="mid">
            <span class="phase-title">Mid Game</span>
            <div class="items-container"></div>
        </div>
        <div class="phase-card" id="end">
            <span class="phase-title">End Game</span>
            <div class="items-container"></div>
        </div>
    </div>
</main>

<script>
    const defaultData = {
        USF: {
            "Airborne": {
                early: [{n: "Scout", t: "unit"}, {n: "Airdrop MG", t: "unit"}, {n: "Engineers", t: "unit"}],
                mid: [{n: "WSC", t: "build"}, {n: "Mech Support", t: "tech"}, {n: "M3 Halftrack", t: "unit"}],
                end: [{n: "Paratroopers", t: "unit"}, {n: "P-47 Strike", t: "tech"}]
            }
        },
        WEHR: { "Blitz": { early: [{n: "Pio", t: "unit"}], mid: [], end: [] } },
        UKF: { "Standard": { early: [], mid: [], end: [] } },
        DAK: { "Standard": { early: [], mid: [], end: [] } }
    };

    let state = JSON.parse(localStorage.getItem('coh_state_v5')) || defaultData;
    let currentFac = 'USF';
    let currentStrat = Object.keys(state[currentFac])[0];
    let editMode = false;

    function renderFactions() {
        const nav = document.getElementById('factionNav');
        nav.innerHTML = '';
        Object.keys(state).forEach(f => {
            const el = document.createElement('div');
            el.className = `faction-icon ${f === currentFac ? 'active' : ''}`;
            el.innerText = f;
            el.onclick = () => { 
                currentFac = f; 
                currentStrat = Object.keys(state[f])[0] || ""; 
                render(); 
            };
            nav.appendChild(el);
        });
    }

    function renderStrats() {
        const nav = document.getElementById('stratNav');
        nav.innerHTML = '';
        
        Object.keys(state[currentFac]).forEach(s => {
            const el = document.createElement('div');
            el.className = `strat-pill ${s === currentStrat ? 'active' : ''}`;
            el.innerHTML = `
                <span onclick="selectStrat('${s}')">${s}</span>
                ${editMode ? `<span class="delete-btn" onclick="deleteStrat('${s}')">×</span>` : ''}
            `;
            nav.appendChild(el);
        });

        if (editMode) {
            const addBtn = document.createElement('button');
            addBtn.className = 'btn btn-add-strat';
            addBtn.innerText = "+ New Strat";
            addBtn.onclick = addStrat;
            nav.appendChild(addBtn);
        }
    }

    function selectStrat(s) {
        currentStrat = s;
        render();
    }

    function renderBuild() {
        if (!currentStrat || !state[currentFac][currentStrat]) {
            ['early', 'mid', 'end'].forEach(p => document.querySelector(`#${p} .items-container`).innerHTML = 'No strat selected');
            return;
        }

        const build = state[currentFac][currentStrat];
        ['early', 'mid', 'end'].forEach(phase => {
            const container = document.querySelector(`#${phase} .items-container`);
            container.innerHTML = '';
            build[phase].forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.onclick = (e) => { 
                    if(!editMode) div.classList.toggle('completed'); 
                };
                div.innerHTML = `
                    <div class="tag tag-${item.t}"></div>
                    <span class="name" contenteditable="${editMode}" onblur="updateItemText('${phase}', ${index}, this.innerText)">${item.n}</span>
                    <span style="margin-left:auto; font-size:0.6rem; color:var(--text-dim)" contenteditable="${editMode}" onblur="updateItemType('${phase}', ${index}, this.innerText)">${item.t}</span>
                    ${editMode ? `<span class="delete-btn" onclick="deleteItem('${phase}', ${index})">×</span>` : ''}
                `;
                container.appendChild(div);
            });
            
            if(editMode) {
                const add = document.createElement('button');
                add.className = 'add-btn';
                add.innerText = "+ Add Entry";
                add.onclick = () => { 
                    state[currentFac][currentStrat][phase].push({n: "New Entry", t: "unit"}); 
                    render(); 
                };
                container.appendChild(add);
            }
        });
    }

    function updateItemText(phase, idx, val) { state[currentFac][currentStrat][phase][idx].n = val; }
    function updateItemType(phase, idx, val) { state[currentFac][currentStrat][phase][idx].t = val.toLowerCase(); }

    function deleteItem(phase, idx) {
        state[currentFac][currentStrat][phase].splice(idx, 1);
        render();
    }

    function addStrat() {
        const name = prompt("Enter Strategy Name:");
        if (name) {
            state[currentFac][name] = { early: [], mid: [], end: [] };
            currentStrat = name;
            render();
        }
    }

    function deleteStrat(s) {
        if (confirm(`Delete the "${s}" build order?`)) {
            delete state[currentFac][s];
            currentStrat = Object.keys(state[currentFac])[0] || "";
            render();
        }
    }

    function toggleEdit() {
        editMode = !editMode;
        document.getElementById('editToggle').innerText = editMode ? "EXIT EDITING" : "EDIT BUILDS";
        render();
    }

    function saveData() {
        localStorage.setItem('coh_state_v5', JSON.stringify(state));
        alert("Intelligence saved to local archives.");
        editMode = false;
        render();
    }

    function resetProgress() {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('completed'));
    }

    function render() {
        renderFactions();
        renderStrats();
        renderBuild();
        document.getElementById('currentFactionLabel').innerText = currentFac;
    }

    render();
</script>
</body>
</html>
